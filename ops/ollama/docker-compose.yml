services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      LLM_DOMAIN: ${LLM_DOMAIN}
      OLLAMA_API_TOKEN: ${OLLAMA_API_TOKEN}

volumes:
  ollama:
  caddy_data:
  caddy_config: