# AttendVortex Render Blueprint
#
# Backend: FastAPI (Python 3.11) -> URL becomes https://attendvortex-api.onrender.com
# Frontend: Next.js on Vercel (see DEPLOYMENT.md). The optional Render frontend
#           service below is only an alternative to Vercel.
#
# DASHBOARD-ONLY VARIABLES (sync: false) MUST be set in the Render dashboard once
# the service exists, otherwise the app falls back to localhost defaults and the
# backend will not be able to reach MongoDB:
#   - MONGODB_URI  -> paste the Atlas SRV string (mongodb+srv://user:pass@...). REQUIRED.
#   - CORS_ORIGINS -> comma-separated frontend origins, e.g.
#                     https://<your-frontend>.vercel.app,http://localhost:3000
#   - NEXT_PUBLIC_API_URL (frontend) -> https://attendvortex-api.onrender.com/api/v1

services:
  - type: web
    name: attendvortex-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: attendance_db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: CORS_ORIGINS
        sync: false
      - key: EXPORT_DIRECTORY
        value: exports

  - type: web
    name: attendvortex-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false